<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Ledger Bot (JSON & CSV)</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --chat-bg: #ffffff; --border: #e2e8f0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; color: #1e293b; }
    header { background: #0f172a; color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { margin: 0; font-size: 1.2rem; }
    .controls { display: flex; gap: 10px; align-items: center; }
    button, label.file-btn { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
    button.secondary { background: #334155; }
    button:hover, label.file-btn:hover { opacity: 0.9; }
    input[type="file"] { display: none; }
    #chat-container { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
    .bot { background: var(--chat-bg); border: 1px solid var(--border); align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .user { background: var(--primary); color: white; align-self: flex-end; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0.5rem 1.5rem; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .chip { background: #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 16px; font-size: 0.85rem; cursor: pointer; border: none; }
    .chip:hover { background: #cbd5e1; }
    #input-area { background: white; border-top: 1px solid var(--border); padding: 1rem; display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    #user-input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
    th { background: #f1f5f9; }
    .print-btn { margin-top: 8px; background: #059669; font-size: 0.8rem; padding: 5px 10px; }
    @media print { header, .suggestions, #input-area, .print-btn { display: none !important; } body { background: white; } }
  </style>
</head>
<body>

<header>
  <h1>Offline Ledger Bot</h1>
  <div class="controls">
    <button class="secondary" onclick="loadSampleData()">Load Sample Data</button>
    <label class="file-btn">
      Inject JSON / CSV
      <input type="file" id="data-file" accept=".json,.csv" onchange="handleFileUpload(event)">
    </label>
  </div>
</header>

<div id="chat-container">
  <div class="msg bot">
    Hello! Inject a <b>.json</b> or <b>.csv</b> file using the button above, or click <b>"Load Sample Data"</b> to test offline.
  </div>
</div>

<div class="suggestions" id="suggestions"></div>

<div id="input-area">
  <input type="text" id="user-input" placeholder="Ask about balance, dates, or type 'statement for Rahul'..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Ask</button>
</div>

<script>
  let records = [];

  function loadSampleData() {
    records = [
      { person: "Rahul", type: "Total", amount: 10000, date: "2026-10-01" },
      { person: "Rahul", type: "Paid", amount: 1000, date: "2026-10-05" },
      { person: "Rahul", type: "Paid", amount: 1000, date: "2026-10-12" },
      { person: "Rahul", type: "Paid", amount: 1000, date: "2026-10-20" },
      { person: "Priya", type: "Total", amount: 5000, date: "2026-10-10" },
      { person: "Priya", type: "Paid", amount: 2500, date: "2026-10-18" }
    ];
    localStorage.setItem('offline_ledger_data', JSON.stringify(records));
    addMessage("Loaded sample records for <b>Rahul</b> and <b>Priya</b>! Click a prompt below or ask a question.", "bot");
    updateSuggestions();
  }

  window.onload = () => {
    const saved = localStorage.getItem('offline_ledger_data');
    if (saved) {
      records = JSON.parse(saved);
      if (records.length > 0) {
        addMessage(`Restored <b>${records.length}</b> saved records from offline storage.`, "bot");
        updateSuggestions();
      }
    }
  };

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();

    reader.onload = function(e) {
      const content = e.target.result;
      try {
        if (file.name.toLowerCase().endsWith('.json')) {
          const parsed = JSON.parse(content);
          const rawArray = Array.isArray(parsed) ? parsed : (parsed.records || parsed.transactions || []);
          
          records = rawArray.map(item => ({
            person: String(item.person || item.name || '').trim(),
            type: String(item.type || '').trim(),
            amount: parseFloat(item.amount) || 0,
            date: String(item.date || '').trim()
          })).filter(r => r.person !== '');

        } else {
          // CSV fallback
          const lines = content.split(/\r?\n/).filter(line => line.trim() !== '');
          records = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim());
            if (cols.length >= 4) {
              records.push({
                person: cols[0],
                type: cols[1],
                amount: parseFloat(cols[2]) || 0,
                date: cols[3]
              });
            }
          }
        }

        if (records.length === 0) {
          addMessage("⚠️ No valid records found. Ensure your JSON has <code>person</code>, <code>type</code>, <code>amount</code>, and <code>date</code> keys.", "bot");
          return;
        }

        localStorage.setItem('offline_ledger_data', JSON.stringify(records));
        addMessage(`Successfully injected <b>${records.length}</b> records from <i>${file.name}</i>. Saved offline!`, "bot");
        updateSuggestions();
      } catch (err) {
        addMessage(`❌ Error reading file: <b>${err.message}</b>. Please check that your JSON syntax is valid.`, "bot");
      }
    };
    reader.readAsText(file);
  }

  function updateSuggestions() {
    const people = [...new Set(records.map(r => r.person))];
    const container = document.getElementById('suggestions');
    container.innerHTML = '';
    if (people.length === 0) return;

    const p1 = people[0];
    const prompts = [
      `How much does ${p1} need to give?`,
      `On what dates did ${p1} pay?`,
      `Statement for ${p1}`
    ];
    if (people.length > 1) prompts.push(`Balance for ${people[1]}`);

    prompts.forEach(text => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.innerText = text;
      btn.onclick = () => { document.getElementById('user-input').value = text; sendMessage(); };
      container.appendChild(btn);
    });
  }

  function addMessage(html, sender) {
    const chat = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('user-input');
    const query = input.value.trim();
    if (!query) return;
    addMessage(query, 'user');
    input.value = '';
    setTimeout(() => processQuery(query), 150);
  }

  function processQuery(query) {
    if (records.length === 0) {
      addMessage("Please inject a JSON/CSV file or click 'Load Sample Data' first.", "bot");
      return;
    }

    const q = query.toLowerCase();
    const people = [...new Set(records.map(r => r.person))];
    const matchedPerson = people.find(p => q.includes(p.toLowerCase()));

    if (!matchedPerson) {
      addMessage(`I couldn't find a matching name in your question. Names in your file: <b>${people.join(', ')}</b>.`, "bot");
      return;
    }

    const personRecords = records.filter(r => r.person.toLowerCase() === matchedPerson.toLowerCase());
    const totalDue = personRecords.filter(r => r.type.toLowerCase().includes('total') || r.type.toLowerCase().includes('loan')).reduce((sum, r) => sum + r.amount, 0);
    const payments = personRecords.filter(r => r.type.toLowerCase().includes('paid'));
    const totalPaid = payments.reduce((sum, r) => sum + r.amount, 0);
    const remaining = totalDue - totalPaid;

    if (q.includes('statement') || q.includes('history') || q.includes('report')) {
      let tableHtml = `<b>Account Statement: ${matchedPerson}</b>
        <table>
          <tr><th>Date</th><th>Type</th><th>Amount (₹)</th></tr>
          ${personRecords.map(r => `<tr><td>${r.date}</td><td>${r.type}</td><td>₹${r.amount.toLocaleString('en-IN')}</td></tr>`).join('')}
        </table>
        <p style="margin:8px 0 0 0;"><b>Total Expected:</b> ₹${totalDue.toLocaleString('en-IN')} | <b>Paid:</b> ₹${totalPaid.toLocaleString('en-IN')} | <b>Balance Due:</b> ₹${remaining.toLocaleString('en-IN')}</p>
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>`;
      addMessage(tableHtml, "bot");
      return;
    }

    if (q.includes('date') || q.includes('when')) {
      if (payments.length === 0) {
        addMessage(`${matchedPerson} has not made any payments yet.`, "bot");
      } else {
        const list = payments.map(p => `• <b>₹${p.amount.toLocaleString('en-IN')}</b> on ${p.date}`).join('<br>');
        addMessage(`<b>${matchedPerson}</b> made ${payments.length} payment(s):<br>${list}`, "bot");
      }
      return;
    }

    addMessage(
      `Here is the summary for <b>${matchedPerson}</b>:<br>
      • <b>Total Amount:</b> ₹${totalDue.toLocaleString('en-IN')}<br>
      • <b>Total Given:</b> ₹${totalPaid.toLocaleString('en-IN')} (across ${payments.length} payments)<br>
      • <b>Remaining Balance to Give:</b> ₹${remaining.toLocaleString('en-IN')}`,
      "bot"
    );
  }
</script>
</body>
</html>
